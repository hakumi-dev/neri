name: Toolchain contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ARM64 / ${{ matrix.command }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command: [package, native-test --debug, native-test --sanitize, native-test --thread-sanitize]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared tools
        run: |
          test "$(uname -m)" = arm64
          brew install llvm@22 cmake ninja
          test "$("$(brew --prefix llvm@22)/bin/llvm-config" --version)" = 22.1.8
      - name: Run the local Neri entry point
        env:
          BUILD_COMMAND: ${{ matrix.command }}
        run: scripts/build.sh $BUILD_COMMAND
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ strategy.job-index }}
          path: |
            build/work.*/compiler-sources.txt
            build/work.*/*.stdout
            build/work.*/*.stderr
            build/work.*/*.status
            build/work.*/*.source
            build/work.*/*.metrics.json
            build/native/*/Testing/Temporary/
            build/packages/*.tar.gz
          if-no-files-found: ignore

  linux-native:
    name: Linux x86-64 / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        mode: [Release, Debug, Sanitize, ThreadSanitize]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release software-properties-common cmake ninja-build build-essential zlib1g-dev libzstd-dev libedit-dev libffi-dev libxml2-dev
          curl --fail --location --retry 3 https://raw.githubusercontent.com/opencollab/llvm-jenkins.debian.net/cf853fefa308484749df8a87004c580a6c0fe830/llvm.sh -o /tmp/neri-llvm.sh
          echo '03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae  /tmp/neri-llvm.sh' | sha256sum -c -
          sudo bash /tmp/neri-llvm.sh 22
          sudo apt-get install -y llvm-22-dev
          test "$(llvm-config-22 --version)" = 22.1.8
      - name: Build and validate current native components
        if: matrix.mode != 'Release'
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          build_type="$BUILD_MODE"
          sanitizers=OFF
          thread_sanitizer=OFF
          if test "$BUILD_MODE" = Sanitize; then build_type=Debug; sanitizers=ON; fi
          if test "$BUILD_MODE" = ThreadSanitize; then build_type=Debug; thread_sanitizer=ON; fi
          cmake -S . -B build/linux-native -G Ninja \
            -DCMAKE_BUILD_TYPE="$build_type" -DNERI_SANITIZERS="$sanitizers" -DNERI_THREAD_SANITIZER="$thread_sanitizer" \
            -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm -DBUILD_TESTING=ON
          cmake --build build/linux-native --parallel 2
          ctest --test-dir build/linux-native --output-on-failure --no-tests=error
      - name: Bootstrap and validate the language
        if: matrix.mode == 'Release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build.sh test
      - name: Preserve native validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-native-${{ matrix.mode }}
          path: |
            build/linux-native/Testing/Temporary/
            build/native/*/Testing/Temporary/
            build/work.*/compiler-sources.txt
            build/work.*/*.stdout
            build/work.*/*.stderr
            build/work.*/*.status
            build/work.*/*.metrics.json
          if-no-files-found: ignore
