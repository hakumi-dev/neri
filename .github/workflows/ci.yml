name: Toolchain contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: Load shared CI matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: matrix
        run: |
          matrix=$(jq -ce '{include: .jobs}' tooling/ci/matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  contracts:
    name: ${{ matrix.id }}
    needs: catalog
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.id == 'windows-release-install'
        with:
          node-version: '22'
      - name: Prepare Unix guest
        if: matrix.platform != 'windows'
        shell: bash
        env:
          CI_JOB: ${{ matrix.id }}
        run: scripts/ci/jobs.sh prepare "$CI_JOB"
      - name: Run Unix contracts
        if: matrix.platform != 'windows'
        shell: bash
        env:
          CI_JOB: ${{ matrix.id }}
        run: scripts/ci/jobs.sh run "$CI_JOB"
      - name: Prepare Windows guest
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CI_JOB: ${{ matrix.id }}
        run: ./scripts/ci/jobs.ps1 -Action prepare -Job $env:CI_JOB
      - name: Run Windows contracts
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CI_JOB: ${{ matrix.id }}
        run: ./scripts/ci/jobs.ps1 -Action run -Job $env:CI_JOB
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.id }}
          path: |
            build/native/*/Testing/Temporary/
            build/linux-native/Testing/Temporary/
            build/windows/tests/
            build/windows/host-contract-*/
            build/windows/work-*/compiler-sources.txt
            build/windows/work-*/SOURCE-MANIFEST.sha256
            build/windows/work-*/VALIDATED
            build/windows/work-*/toolchain/ARTIFACTS.sha256
            build/tmp/work.*/compiler-sources.txt
            build/tmp/work.*/*.stdout
            build/tmp/work.*/*.stderr
            build/tmp/work.*/*.status
            build/tmp/work.*/*.source
            build/tmp/work.*/*.metrics.json
            build/packages/*.tar.gz
            build/testing/*/summary.json
            build/testing/*/results.jsonl
          if-no-files-found: warn

  supported-platforms:
    name: Required / supported platforms
    if: always()
    needs: [catalog, contracts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every shared matrix job
        env:
          CATALOG_RESULT: ${{ needs.catalog.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: |
          test "$CATALOG_RESULT" = success
          test "$CONTRACTS_RESULT" = success
